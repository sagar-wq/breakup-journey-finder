<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in &ndash; Breakup Journey Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>&#128645; Breakup Journey Finder</h1>
    <p class="sub">Enter your access code to continue.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div class="field">
        <label for="code">Access code</label>
        <input type="text" id="code" name="code" maxlength="10" autocomplete="off"
               autocapitalize="characters" spellcheck="false" placeholder="XXXXXXXXXX" required autofocus>
      </div>
      <button type="submit" class="btn-search">Log in</button>
    </form>
  </div>
</div>
</body>
</html>
